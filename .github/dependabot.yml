version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
