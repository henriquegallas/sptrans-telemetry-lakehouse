[project]
name = "sptrans-telemetry-lakehouse"
version = "0.1.0"
description = "Bronze/silver/gold lakehouse for São Paulo bus GPS telemetry (SPTrans Olho Vivo API) with PySpark, Apache Iceberg, Airflow and AWS."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Henrique Gallas da Rosa" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector", "spark_jobs", "quality"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "DTZ",     # naive datetimes are a classic telemetry bug
    "T20",     # no print(); use structured logging
    "PT",      # flake8-pytest-style
    "PTH",     # prefer pathlib
    "SIM",     # flake8-simplify
    "RUF",     # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["collector", "spark_jobs", "quality"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
